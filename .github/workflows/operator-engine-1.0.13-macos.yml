name: Temporary Operator Engine 1.0.13 macOS build

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/operator-engine-1.0.13-macos.yml"
      - ".release-input/operator-engine-1.0.13-source.tar.gz.enc"

permissions:
  contents: write

jobs:
  package:
    name: macOS ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            arch: x64
          - runner: macos-15
            arch: arm64
    runs-on: ${{ matrix.runner }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4

      - name: Decrypt and attest one-release build input
        env:
          SOURCE_KEY: ${{ secrets.OPERATOR_ENGINE_BUILD_KEY_1013 }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SOURCE_KEY"
          mkdir -p operator-engine
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 600000 -md sha256 \
            -in .release-input/operator-engine-1.0.13-source.tar.gz.enc \
            -out operator-engine-source.tar.gz \
            -pass env:SOURCE_KEY
          echo 'c16dac012152fb23c689879b158f8a53bb354e306772524877a99595f0529ce7  operator-engine-source.tar.gz' \
            | shasum -a 256 -c -
          tar -xzf operator-engine-source.tar.gz -C operator-engine
          rm operator-engine-source.tar.gz

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: operator-engine/package-lock.json

      - run: npm ci
        working-directory: operator-engine
      - run: npm run typecheck
        working-directory: operator-engine
      - run: npm run test:log-policy
        working-directory: operator-engine
      - run: npm run test:restart-policy
        working-directory: operator-engine
      - run: npm run test:contract-migration
        working-directory: operator-engine
      - run: npm run test:protected-runtime
        working-directory: operator-engine

      - name: Package ad-hoc signed application
        working-directory: operator-engine
        run: npm run package:mac -- --${{ matrix.arch }}

      - name: Verify architecture, protection, signature, ZIP, and DMG
        working-directory: operator-engine
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          test "$version" = '1.0.13'
          dmg="release/Switch-Operator-Engine-${version}-${{ matrix.arch }}.dmg"
          zip="release/Switch-Operator-Engine-${version}-${{ matrix.arch }}.zip"
          test -f "$dmg"
          test -f "$zip"
          executable="$(find release -path '*/Switch Operator Engine.app/Contents/MacOS/Switch Operator Engine' -type f -print -quit)"
          asar="$(find release -path '*/Switch Operator Engine.app/Contents/Resources/app.asar' -type f -print -quit)"
          test -n "$executable"
          test -n "$asar"
          app_bundle="$(dirname "$(dirname "$(dirname "$executable")")")"
          file "$executable"
          codesign --verify --deep --strict --verbose=4 "$app_bundle"
          codesign -dv --verbose=4 "$app_bundle" 2>&1 | grep -F 'Signature=adhoc'
          node scripts/verify-protected-asar.cjs "$asar"

          smoke_root="$(mktemp -d)"
          archive_root="$smoke_root/archive"
          mkdir -p "$archive_root"
          ditto -x -k "$zip" "$archive_root"
          archive_app="$(find "$archive_root" -name 'Switch Operator Engine.app' -type d -print -quit)"
          test -n "$archive_app"
          codesign --verify --deep --strict --verbose=4 "$archive_app"
          codesign -dv --verbose=4 "$archive_app" 2>&1 | grep -F 'Signature=adhoc'
          archive_executable="$archive_app/Contents/MacOS/Switch Operator Engine"
          "$archive_executable" \
            --smoke-test \
            --smoke-operator \
            --smoke-faq \
            --smoke-user-data="$smoke_root/user-data" \
            --screenshot="$smoke_root/smoke.png" \
            >"$smoke_root/stdout.txt" \
            2>"$smoke_root/stderr.txt"
          grep -F 'SWITCH_GUI_SMOKE_RESULT {"passed":true' "$smoke_root/stdout.txt"
          test -s "$smoke_root/smoke.png"

          dmg_mount="$smoke_root/dmg"
          mkdir -p "$dmg_mount"
          hdiutil attach "$dmg" -nobrowse -readonly -mountpoint "$dmg_mount" >/dev/null
          cleanup_dmg() { hdiutil detach "$dmg_mount" >/dev/null 2>&1 || true; }
          trap cleanup_dmg EXIT
          dmg_app="$(find "$dmg_mount" -name 'Switch Operator Engine.app' -type d -print -quit)"
          test -n "$dmg_app"
          codesign --verify --deep --strict --verbose=4 "$dmg_app"
          codesign -dv --verbose=4 "$dmg_app" 2>&1 | grep -F 'Signature=adhoc'
          cleanup_dmg
          trap - EXIT
          shasum -a 256 "$dmg" "$zip"

      - name: Upload verified packages to draft public release
        working-directory: operator-engine
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload operator-engine-v1.0.13 \
            "release/Switch-Operator-Engine-1.0.13-${{ matrix.arch }}.dmg" \
            "release/Switch-Operator-Engine-1.0.13-${{ matrix.arch }}.zip" \
            --clobber
